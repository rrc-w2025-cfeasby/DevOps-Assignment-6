apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ymb
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: draghujon/ymb-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
